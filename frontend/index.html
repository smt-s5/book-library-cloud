<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Library Cloud</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>📚 Book Library Cloud</h1>
        <p>Implementasi Arsitektur Cloud AWS & Docker</p>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Tambah Buku Baru</h2>
            <form id="bookForm">
                <div class="form-group">
                    <label for="title">Judul Buku:</label>
                    <input type="text" id="title" required placeholder="Masukkan judul buku">
                </div>
                <div class="form-group">
                    <label for="author">Penulis:</label>
                    <input type="text" id="author" required placeholder="Masukkan nama penulis">
                </div>
                <button type="submit">Simpan Buku</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Koleksi Buku</h2>
            <div id="bookList" class="book-grid">
                <p class="loading">Memuat data buku...</p>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
