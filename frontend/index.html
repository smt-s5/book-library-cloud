<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Library Cloud</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <span class="brand">Book Library</span>
    </nav>

    <div class="container">

        <h1 class="page-title">Manage Library</h1>

        <hr>

        <form id="bookForm">

            <div class="form-group">
                <label>Book Name</label>
                <input
                    type="text"
                    id="title"
                    class="form-control"
                    placeholder="Book Name"
                    required>
            </div>

            <div class="form-group">
                <label>Author</label>
                <input
                    type="text"
                    id="author"
                    class="form-control"
                    placeholder="Author"
                    required>
            </div>

            <button type="submit" class="btn-primary">
                Add Book
            </button>

        </form>

        <h2 class="section-title">Your Books</h2>

        <table>

            <thead>
                <tr>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="bookList">

            </tbody>

        </table>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
